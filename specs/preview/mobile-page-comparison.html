      case 'cleanup':return section('',row('通过 Google 相册释放空间','','hard-drive')+`<div style="padding:0 14px 13px;font-size:12px;color:var(--ph-sub);line-height:1.6">备份完成后，由 Google 相册识别并移除已备份的本机照片和视频。</div>`+action('前往 Google 相册释放空间','demo-cleanup'))+section('',action('其他打开方式','cleanup-alternatives'),'请确认 Google 相册当前使用的是备份账号。菜单名称和位置可能因版本或语言有所不同。')+section('',`<div style="padding:14px;font-size:12px;line-height:1.65;color:var(--ph-sub)">请选择释放设备空间，避免误入清理云端存储。${platform==='ios'?'开启 iCloud 照片时，本机删除也会同步到同一图库的其他设备。':'请先确认备份完成，留意系统回收站。'} PicHarbor 不直接删除本机原件。</div>`);
      default:return '';
    }
  }
  function top(){
    if(roots.includes(page))return `<div class="top-actions">${page==='photos'?btn(icon('list-filter'),'media-filter'):''}<div class="right-actions">${page==='photos'?btn(selecting?'完成':'选择','select'):page==='activity'?btn(icon('ellipsis')+'<span>更多</span>','activity-menu'):''}</div></div><div class="top-title">${names[page]}</div>`;
    return `<div class="top-actions">${btn(icon(page==='detail'?'x':'chevron-left'),'back')}<span class="sub-title">${names[page]}</span><div class="right-actions">${page==='detail'?btn(icon('info'),'information')+btn(icon('share'),'demo-share'):page==='archives'||page==='batch'?btn(icon('ellipsis'),'activity-menu'):''}</div></div>`;
  }
  function sheetMarkup(){
    if(!sheet)return '';
    let body='';
    if(sheet.kind==='pick')body=sheet.options.map(o=>row(o,`choose:${sheet.key}:${o}`,'',values[sheet.key]===o?'✓':'')).join('');
    else if(sheet.kind==='menu')body=sheet.items.map(([label,id])=>row(label,id)).join('');
    else body=`<p>${sheet.text||''}</p>${sheet.body||''}${sheet.confirm?btn(sheet.confirm.label,sheet.confirm.action,'primary-action'):''}`;
    return `<div class="sheet-layer"><div class="sheet-panel" role="dialog" aria-modal="true" aria-label="${sheet.title}"><div class="sheet-handle"></div><div class="sheet-title"><span>${sheet.title}</span>${btn(icon('x'),'close')}</div>${body}</div></div>`;
  }
  function render(reset=false){
    pageSelect.value=page;stateSelect.value=scenario;
    root.querySelector('#ph-location').textContent=roots.includes(page)?names[page]:`${names[tab]} / ${names[page]}`;
    ['ios','android'].forEach(platform=>{
      const phone=root.querySelector('#ph-'+platform),scroll=phone.querySelector('[data-content]');const oldScroll=scroll.scrollTop;
      phone.querySelector('[data-top]').innerHTML=top();scroll.innerHTML=screen(platform);scroll.scrollTop=reset?0:oldScroll;
      phone.querySelector('[data-tabs]').innerHTML=page==='detail'?'':roots.map((id,i)=>`<button type="button" class="tab ${tab===id?'active':''}" data-do="tab:${id}" aria-label="${names[id]}" aria-pressed="${tab===id}"><span class="tab-icon">${icon(['images','cloud-upload','history','settings'][i])}</span><span>${names[id]}</span></button>`).join('');
      phone.querySelector('.sheet-layer')?.remove();if(sheet)phone.insertAdjacentHTML('beforeend',sheetMarkup());
    });
    if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:18,height:18}});
  }
  function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{page:names[page],scenario,framework:'iOS 与 Android 同步结构预览，待用户确认'},privateContent:{page,scenario,values,tab}}).catch(()=>{});}
  function go(id){if(!names[id])return;history.push({page,tab});page=id;tab=roots.includes(id)?id:(belongs[id]||tab);sheet=null;render(true);save();}
  function message(title,text,confirm){sheet={title,text,confirm};render();}
  root.addEventListener('click',event=>{
    const button=event.target.closest('[data-do]');if(!button)return;
    const id=button.dataset.do;
    if(id==='noop')return;
    if(id.startsWith('go:')){go(id.slice(3));return;}
    if(id.startsWith('tab:')){page=id.slice(4);tab=page;history=[];sheet=null;render(true);save();return;}
    if(id==='back'){const prev=history.pop();page=prev?.page||tab;tab=prev?.tab||tab;sheet=null;render(true);save();return;}
    if(id==='close'){sheet=null;render();return;}
    if(id==='select'){selecting=!selecting;if(!selecting)selected=[];render();return;}
    if(id==='select-all'){selected=Array.from({length:18},(_,i)=>i);render();return;}
    if(id.startsWith('photo:')){const n=+id.slice(6);if(selecting){selected=selected.includes(n)?selected.filter(i=>i!==n):[...selected,n];render();}else go('detail');return;}
    if(id.startsWith('filter:')){filter=id.slice(7);render();return;}
    if(id.startsWith('source:')){source=id.slice(7);render();return;}
    if(id.startsWith('status:')){status=id.slice(7);render();return;}
    if(id.startsWith('toggle:')){const key=id.slice(7);values[key]=!values[key];render();save();return;}
    if(id.startsWith('pick:')){const [,key,options]=id.split(':');sheet={kind:'pick',title:button.querySelector('.row-label')?.textContent||'选择',key,options:options.split('|')};render();return;}
    if(id.startsWith('choose:')){const [,key,...val]=id.split(':');values[key]=val.join(':');sheet=null;render();save();return;}
    if(id==='scope-all'){values.all=true;values.albums=[];render();return;}
    if(id.startsWith('scope-album:')){const album=id.slice(12);values.all=false;values.albums=values.albums.includes(album)?values.albums.filter(a=>a!==album):[...values.albums,album];render();return;}
    if(id==='albums'){sheet={kind:'menu',title:'相簿',items:[['全部可访问项目','close'],['相机 · 908 项','close'],['旅行 · 186 项','close'],['截图 · 142 项','close']]};render();return;}
    if(id==='media-filter'){sheet={kind:'menu',title:'媒体类型',items:['全部','照片','视频','Live Photo'].map(x=>[x,'close'])};render();return;}
    if(id==='activity-menu'){sheet={kind:'menu',title:'活动选项',items:[['暂停任务','demo-pause'],['继续暂停任务','demo-resume'],['重试全部异常任务','demo-retry'],['归档记录','go:archives'],['归档已完成','demo-archive'],['选择归档','demo-archive'],['停止并移除未完成','demo-remove']]};render();return;}
    if(id==='information'){sheet={title:'资源详情',body:plain('文件名','IMG_1284.HEIC')+plain('类型','HEIC + MOV')+plain('照片大小','3.2 MB')+plain('动态视频','1.6 MB')+plain('所在相簿','相机')};render();return;}
    if(id==='filename'){message('完整文件名','IMG_1284.HEIC');return;}
    if(id==='advanced'){sheet={title:'高级信息',body:plain('来源','手动备份')+plain('上传画质',values.quality)+plain('Live Photo',values.live)+plain('确认结果','两份资源对应同一云端项目')};render();return;}
    if(id==='confirm-backup'){message('确认备份范围与设置',`${selecting?selected.length:'1,284'} 项 · ${values.quality} · ${values.live}`,{label:'开始备份（演示）',action:'demo-start'});return;}
    if(id==='demo-start'){scenario='running';selecting=false;selected=[];sheet=null;go('activity');return;}
    if(id==='demo-pause'){scenario='paused';sheet=null;render();save();return;}
    if(id==='demo-resume'){scenario='running';sheet=null;render();save();return;}
    if(id==='demo-login'){message('连接 Google 账号','此处展示登录入口，预览不打开登录、不读取凭据，也不会发起网络请求。');return;}
    if(id==='restore'){message('恢复默认设置？','实际应用将关闭自动备份并要求重新确认范围；账号、媒体和历史记录保留。此预览不会改动手机。');return;}
    if(id==='platform-background'){message('Android 后台运行','系统专属区域：通知、电池优化、自启动及重启恢复。iOS 使用自身的后台安排，无等价的自启动开关。');return;}
    if(id==='platform-storage'){message('Android 存储访问','系统专属区域：MediaStore、系统文件夹授权及 SD 卡。这里不打开真实文件选择器。');return;}
    if(id==='version-limit'){message('Android 可用版本','保留平台明确提供的全部版本。系统通常仅暴露当前文件，不能把当前文件当作编辑前原件。');return;}
    if(id==='cleanup-alternatives'){message('其他打开方式','打开 Google 相册，点击头像，再进入“释放空间”。预览不会打开外部应用。');return;}
    const demos={'demo-policy':['应用设置','只演示确认反馈，不修改实际任务。'],'demo-scope':['范围已确认','演示范围与自动备份偏好已在预览中保留，未写入手机。'],'demo-switch':['切换账号','仅演示账号选择，不连接真实账号。'],'demo-logout':['退出当前账号？','实际应用将移除本机凭据并暂停任务，保留历史。预览不会退出手机账号。'],'demo-speed':['节点测速','预览展示示例延时，不访问 Google 或代理节点。'],'demo-import':['添加配置','此处仅展示下载或保存后的反馈，不进行导入。'],'demo-scan':['扫描二维码','实际应用使用系统相机或扫描页面，此处不请求相机权限。'],'demo-file':['导入配置文件','实际应用打开系统文件选择器，此处仅展示入口。'],'demo-image':['从图片识别','实际应用打开图片选择器，此处仅展示入口。'],'demo-paste':['粘贴配置','实际应用提供 Clash YAML / JSON 输入，此处不读取剪贴板。'],'demo-config':['使用配置','不改变实际代理连接。'],'demo-remove':['确认移除？','仅展示确认层，不删除任何配置、任务或媒体。'],'demo-archive':['归档操作','归档只调整活动展示，不删除媒体。这里不执行实际归档。'],'demo-retry':['重试任务','演示重试入口，不执行上传。'],'demo-cancel':['取消任务？','仅演示确认，不影响手机上的任务。'],'demo-permission':['管理相册访问','实际应用使用各系统原生授权界面。'],'demo-system':['系统设置','预览不会打开系统设置。'],'demo-export':['导出诊断日志','实际应用生成包含 JSONL 与可读文本的 ZIP；预览不读取或导出任何日志。'],'demo-dates':['日期范围','全部现存日志 / 自定义起止日期。'],'demo-license':['组件许可证','实际应用显示随包附带的许可证。'],'demo-repository':['项目仓库','Cc-Cece / PicHarbor-Mobile（此处不打开外部链接）。'],'demo-share':['系统分享','实际应用使用原生分享面板，Live Photo 保留可用的原始资源。'],'demo-pair':['配对电脑','扫码或输入配对信息后由电脑确认；预览不发现或连接设备。'],'demo-transfer':['发送到电脑','仅展示传输入口，不发送文件。'],'demo-cleanup':['Google 相册释放空间','实际应用跳转到 Google 相册官方功能；预览不打开应用，也不会删除照片。'],'demo-backup-node':['备用节点','实际应用选择有序备用节点，并明确是否允许直连。']};
    if(demos[id])message(...demos[id]);
  });
  pageSelect.innerHTML=pages.map(([id,label])=>`<option value="${id}">${label}</option>`).join('');
  pageSelect.addEventListener('change',()=>go(pageSelect.value));
  stateSelect.addEventListener('change',()=>{scenario=stateSelect.value;sheet=null;render();save();});
  const restore=s=>{const data=s?.privateContent;if(!data)return;if(names[data.page])page=data.page;if(['ready','running','paused','offline','limited','empty','signedout'].includes(data.scenario))scenario=data.scenario;if(roots.includes(data.tab))tab=data.tab;if(data.values)Object.assign(values,data.values);render();};
  render();restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState)restore(event.detail.globals.widgetState);});
})();
</script>
